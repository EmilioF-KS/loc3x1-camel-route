apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: m1-med
spec:
  flows:
    - route:
        id: m1-med-controller
        from:
          uri: platform-http:/{{{{controller_path}}}}
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              level: INFO
          - xslt:
              resourceUri: {{{{request_xslt}}}}
          - to:
              uri: {{{{provider_uri}}}}?connectTimeout={{{{provider.timeoutMs}}}}&socketTimeout={{{{provider.timeoutMs}}}}
          - xslt:
              resourceUri: {{{{reply_xslt}}}}
    - on-exception:
        handled: true
        redelivery-policy:
          maximumRedeliveries: {{provider.retry.maxAttempts}}
          redeliveryDelay: {{provider.retry.delayMs}}
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: CamelHttpResponseCode
              constant: 500
          - set-body:
              constant: <Error>Internal Server Error</Error>
          - log:
              message: "[${header.X-Correlation-ID}] Error handled: ${exception.message}"
              level: ERROR
