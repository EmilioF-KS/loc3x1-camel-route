route:
  id: api-get-location-list-v1
  from:
    uri: platform-http:/api/loc/v1/get-location-list
    steps:
      - setHeader:
          name: Content-Type
          constant: application/xml
      - bean:
          ref: com.example.validation.XmlSchemaValidator
          method: validateBody
          parameters:
            - ${body}
            - contracts/selected/LocationRetrievalLOC3X1B/GetLocationListRequest.xsd
      - to:
          uri: xslt:classpath:xslt/LOC3X1GetLocationListRequestMap.xsl
      - to:
          uri: direct:provider/crp10x1
      - to:
          uri: direct:provider/crp11x1
      - to:
          uri: direct:provider/loc3x1b
      - to:
          uri: xslt:classpath:xslt/GetLocationListLOC3X1BReplyMap.xsl

