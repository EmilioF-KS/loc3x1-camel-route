- on-exception:
    exception: java.lang.Exception
    handled:
      constant: true
    redelivery-policy:
      maximumRedeliveries: 2
      redeliveryDelay: 1000
    steps:
      - set-header:
          name: Content-Type
          constant: application/xml
      - set-header:
          name: CamelHttpResponseCode
          constant: 500
      - set-body:
          constant: <Error>Internal Server Error</Error>

- route:
    id: location-crp10x1
    from:
      uri: platform-http:/api/location/crp10x1/get-country
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-body:
            simple: '<GetCountryRequest xmlns="http://ei/corporate/get_country_request_crp10x1"/>'
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: '{{providers.mock.baseUrl}}/api/crp10x1/v1/get-country?bridgeEndpoint=true'

- route:
    id: location-crp11x1
    from:
      uri: platform-http:/api/location/crp11x1/get-state-or-province
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-body:
            simple: '<GetStateOrProvinceRequest xmlns="http://ei/corporate/get_state_or_province_request_crp11x1"/>'
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: '{{providers.mock.baseUrl}}/api/crp11x1/v1/get-state-or-province?bridgeEndpoint=true&throwExceptionOnFailure=false'

- route:
    id: location-loc3x1b
    from:
      uri: platform-http:/api/location/loc3x1b/get-location-list
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-body:
            simple: '<GetLocationListRequest xmlns="http://ei/location/get_location_list_request_loc3x1b"/>'
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: '{{providers.mock.baseUrl}}/api/loc3x1b/v1/get-location-list?bridgeEndpoint=true'

- route:
    id: orchestration-get-location-list-v1
    from:
      uri: platform-http:/api/orchestration/v1/get-location-list
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - convert-body-to:
            type: java.lang.String
        - set-body:
            simple: ${bodyAs(String).replaceAll('^(\\uFEFF|\\s)+','')}
        - set-property:
            name: inputBody
            simple: ${body}
        - set-header:
            name: Mediation-Stage
            constant: request
        - process:
            ref: locationMediationProcessor
        - choice:
            when:
              - simple: ${body} != null
                steps:
                  - set-header:
                      name: spCode
                      xpath:
                        expression: /*[local-name()='GetLocationListRequest']/*[local-name()='StateOrProvinceCode']/text()
                  - set-header:
                      name: countryCode
                      xpath:
                        expression: /*[local-name()='GetLocationListRequest']/*[local-name()='CountryCode']/text()
        - choice:
            when:
              - simple: ${header.spCode} != null
                steps:
                  - set-body:
                      simple: '<GetStateOrProvinceRequest xmlns="http://ei/corporate/get_state_or_province_request_crp11x1"><StateOrProvinceCode>${header.spCode}</StateOrProvinceCode></GetStateOrProvinceRequest>'
            otherwise:
              steps:
                - set-body:
                    simple: '<GetStateOrProvinceRequest xmlns="http://ei/corporate/get_state_or_province_request_crp11x1"/>'
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: '{{providers.mock.baseUrl}}/api/crp11x1/v1/get-state-or-province?bridgeEndpoint=true'
        - set-body:
            simple: ${exchangeProperty.inputBody}
        - choice:
            when:
              - simple: ${header.countryCode} != null
                steps:
                  - set-body:
                      simple: '<GetCountryRequest xmlns="http://ei/corporate/get_country_request_crp10x1"><CountryCode>${header.countryCode}</CountryCode></GetCountryRequest>'
            otherwise:
              steps:
                - set-body:
                    simple: '<GetCountryRequest xmlns="http://ei/corporate/get_country_request_crp10x1"/>'
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: '{{providers.mock.baseUrl}}/api/crp10x1/v1/get-country?bridgeEndpoint=true&throwExceptionOnFailure=false'
        - log:
            message: "orchestration: after crp10x1"
        - set-body:
            simple: ${exchangeProperty.inputBody}
        - log:
            message: "orchestration: building canonical LOC3X1B request (empty envelope)"
        - set-body:
            simple: '<GetLocationListRequest xmlns="http://ei/location/get_location_list_request_loc3x1b"/>'
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - set-header:
            name: CamelHttpMethod
            constant: POST
        - log:
            message: "orchestration: loc3x1b request=${body}"
        - to:
            uri: '{{providers.mock.baseUrl}}/api/loc3x1b/v1/get-location-list?bridgeEndpoint=true&throwExceptionOnFailure=false'
        - xslt:
            uri: xslt:classpath:xslt/location_transform.xsl
        - log:
            message: "orchestration: after loc3x1b"
        - log:
            message: "orchestration: loc3x1b status=${header.CamelHttpResponseCode}"
        - set-header:
            name: Mediation-Stage
            constant: response
        - process:
            ref: locationMediationProcessor
        - choice:
            when:
              - simple: ${header.CamelHttpResponseCode} >= 400
                steps:
                  - set-header:
                      name: Content-Type
                      constant: application/xml
                  - set-header:
                      name: CamelHttpResponseCode
                      constant: 500
                  - set-body:
                      constant: <Error>Internal Server Error</Error>
            otherwise:
              steps:
                - set-header:
                    name: CamelHttpResponseCode
                    constant: 200
        - log:
            message: "orchestration: reply=${body}"

- route:
    id: location-loc3x2-get-location
    from:
      uri: platform-http:/api/location/loc3x2/get-location
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - convert-body-to:
            type: java.lang.String
        - set-body:
            simple: ${bodyAs(String).replaceAll('^(\\uFEFF|\\s)+','')}
        - set-property:
            name: inputBody
            simple: ${body}
        - set-header:
            name: Mediation-Stage
            constant: request
        - process:
            ref: LocationRetrievalLOC3X2MediationProcessor
        - xslt:
            uri: xslt:classpath:xslt/LocationRetrievalLOC3X2GetLocationRequestMap.xsl
        - set-header:
            name: isoCode
            xpath:
              expression: /*[local-name()='GetLocation3X2B']/*[local-name()='GetLocationRequest']/*[local-name()='StandardizedAddress']/*[local-name()='ISOCountryCode']/text()
        - choice:
            when:
              - simple: ${header.isoCode} == null
                steps:
                  - set-header:
                      name: CamelHttpResponseCode
                      constant: 400
                  - set-body:
                      constant: <SimpleFault xmlns="http://ei/core/simplefault"><FaultMessageText>Missing ISOCountryCode</FaultMessageText></SimpleFault>
            otherwise:
              steps:
                - set-body:
                    simple: '<GetLocation3X2BResponse xmlns="http://ei/location/location_retrieval_loc3x2b"><GetLocationReply xmlns="http://ei/location/get_location_reply_loc3x2b"><Location xmlns="http://ei/location/locationx1"/><StatusInformation xmlns="http://ei/core/status_informationx1"/></GetLocationReply></GetLocation3X2BResponse>'
                - set-header:
                    name: CamelHttpResponseCode
                    constant: 200
        - xslt:
            uri: xslt:classpath:xslt/LocationRetrievalLOC3X2GetLocationReplyMap.xsl
        - set-header:
            name: Mediation-Stage
            constant: response
        - process:
            ref: LocationRetrievalLOC3X2MediationProcessor
