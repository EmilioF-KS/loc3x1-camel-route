apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: loc-service59
spec:
  flows:
    - onException:
        exception: java.lang.Exception
        handled:
          constant: true
        redeliveryPolicy:
          maximumRedeliveries: 3
          redeliveryDelay: 1000
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: CamelHttpResponseCode
              constant: 500
          - setBody:
              constant: <Error>Internal Server Error</Error>
          - log:
              message: "[${header.X-Correlation-ID}] Error handled: ${exception.message}"
              loggingLevel: ERROR
    - from:
        uri: platform-http:/loc/GetLocation
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{{{request_xslt}}}}"
          - to:
              uri: "{{provider.uri}}?connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{{{reply_xslt}}}}"
