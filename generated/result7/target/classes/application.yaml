spring:
  application:
    name: loc-service7

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"

security:
  requireApiKey: false

camel:
  main:
    routesIncludePattern: classpath:routes/*.yaml
  springboot:
    routes-include-pattern: classpath:routes/*.yaml
    routesIncludePattern: classpath:routes/*.yaml

providers:
  mock:
    baseUrl: http://localhost:8091
