route:
  id: test-loc3x1b
  from:
    uri: platform-http:/api/test/loc3x1b/get-location-list
    steps:
      - set-header:
          name: Content-Type
          constant: application/xml
      - remove-headers:
          pattern: CamelHttp*
      - to:
          uri: http://{{providers.mock.baseUrl}}/api/loc3x1b/v1/get-location-list?bridgeEndpoint=true
      - to:
          uri: validator:classpath:contracts/selected/LocationRetrievalLOC3X1B/LocationListReply.xsd

