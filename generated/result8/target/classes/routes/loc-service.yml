        - to:
            uri: http://{{providers.mock.baseUrl}}/api/loc3x1b/v1/get-location-list?bridgeEndpoint=true

- route:
    id: orchestration-get-location-list-v1
    from:
      uri: platform-http:/api/orchestration/v1/get-location-list
      steps:
        - set-header:
            name: Content-Type
            constant: application/xml
        - set-property:
            name: inputBody
            simple: ${body}
        - set-header:
            name: spCode
            xpath:
              expression: |
                declare namespace ns='http://ei/location/get_location_list_request_loc3x1b';
                /ns:GetLocationListRequest/ns:StateOrProvinceCode/text()
        - set-header:
            name: countryCode
            xpath:
              expression: |
                declare namespace ns='http://ei/location/get_location_list_request_loc3x1b';
                /ns:GetLocationListRequest/ns:CountryCode/text()
        - choice:
            when:
              - simple: ${header.spCode} != null
                steps:
                  - set-body:
                      simple: <GetStateOrProvinceRequest xmlns="http://ei/corporate/get_state_or_province_request_crp11x1"><StateOrProvinceCode>${header.spCode}</StateOrProvinceCode></GetStateOrProvinceRequest>
            otherwise:
              steps:
                - set-body:
                    simple: <GetStateOrProvinceRequest xmlns="http://ei/corporate/get_state_or_province_request_crp11x1"/>
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - to:
            uri: http://{{providers.mock.baseUrl}}/api/crp11x1/v1/get-state-or-province?bridgeEndpoint=true
        - set-body:
            simple: ${exchangeProperty.inputBody}
        - choice:
            when:
              - simple: ${header.countryCode} != null
                steps:
                  - set-body:
                      simple: <GetCountryRequest xmlns="http://ei/corporate/get_country_request_crp10x1"><CountryCode>${header.countryCode}</CountryCode></GetCountryRequest>
            otherwise:
              steps:
                - set-body:
                    simple: <GetCountryRequest xmlns="http://ei/corporate/get_country_request_crp10x1"/>
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - to:
            uri: http://{{providers.mock.baseUrl}}/api/crp10x1/v1/get-country?bridgeEndpoint=true
        - set-body:
            simple: ${exchangeProperty.inputBody}
        - set-header:
            name: Content-Type
            constant: application/xml
        - remove-headers:
            pattern: CamelHttp*
        - to:
            uri: http://{{providers.mock.baseUrl}}/api/loc3x1b/v1/get-location-list?bridgeEndpoint=true

