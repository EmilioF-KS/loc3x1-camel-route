apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: loc-service
spec:
  flows:
    - onException:
        exception: java.lang.Exception
        handled:
          constant: true
        redeliveryPolicy:
          maximumRedeliveries: 3
          redeliveryDelay: 1000
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: CamelHttpResponseCode
              constant: 500
          - setBody:
              constant: <Error>Internal Server Error</Error>
          - log:
              message: "[${header.X-Correlation-ID}] Error handled: ${exception.message}"
              loggingLevel: ERROR
    - from:
        uri: "platform-http:/loc/GetLocationList3X1B"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetLocationList3X1B?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
    - from:
        uri: "platform-http:/loc/GetStateOrProvince"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetStateOrProvince?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
    - from:
        uri: "platform-http:/loc/GetCountry"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetCountry?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
    - from:
        uri: "platform-http:/loc/GetLocationList3X1M"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetLocationList3X1M?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
    - from:
        uri: "platform-http:/loc/GetLocationWithTaxingJurisdictions3X1B"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetLocationWithTaxingJurisdictions3X1B?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
    - from:
        uri: "platform-http:/loc/GetLocationWithTaxingJurisdictions3X1M"
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
          - to:
              uri: "http://localhost:8081/svc/GetLocationWithTaxingJurisdictions3X1M?bridgeEndpoint=true&throwExceptionOnFailure=false&connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}"
          - to:
              uri: "xslt:{{classpath:xslt/identity.xsl}}"
