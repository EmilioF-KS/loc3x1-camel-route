apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: loc-service
spec:
  flows:
    - route:
        id: loc-service-GetStateOrProvince-controller
        from:
          uri: platform-http:/loc/getLocationList
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              level: INFO
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
          - to:
              uri: http://provider/locations?connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
    - route:
        id: loc-service-GetCountry-controller
        from:
          uri: platform-http:/loc/getLocationList
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              level: INFO
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
          - to:
              uri: http://provider/locations?connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
    - route:
        id: loc-service-GetLocationList3X1M-controller
        from:
          uri: platform-http:/loc/getLocationList
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              level: INFO
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
          - to:
              uri: http://provider/locations?connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
    - route:
        id: loc-service-GetLocationWithTaxingJurisdictions3X1M-controller
        from:
          uri: platform-http:/loc/getLocationList
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              level: INFO
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
          - to:
              uri: http://provider/locations?connectTimeout={{provider.timeoutMs}}&socketTimeout={{provider.timeoutMs}}
          - xslt:
              resourceUri: classpath:xslt/identity.xsl
    - on-exception:
        handled: true
        redelivery-policy:
          maximumRedeliveries: {{provider.retry.maxAttempts}}
          redeliveryDelay: {{provider.retry.delayMs}}
        steps:
          - set-header:
              name: Content-Type
              constant: application/xml
          - set-header:
              name: CamelHttpResponseCode
              constant: 500
          - set-body:
              constant: <Error>Internal Server Error</Error>
          - log:
              message: "[${header.X-Correlation-ID}] Error handled: ${exception.message}"
              level: ERROR
