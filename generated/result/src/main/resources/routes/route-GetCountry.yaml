apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: route-GetCountry
spec:
  flows:
    - from:
        uri: platform-http:/loc/GetCountry
        steps:
          - setHeader:
              name: Content-Type
              constant: application/xml
          - setHeader:
              name: X-Correlation-ID
              simple: "${exchangeId}"
          - log:
              message: "[${header.X-Correlation-ID}] Request received"
              loggingLevel: INFO
          - to:
              uri: "xslt:classpath:xslt/identity.xsl"
          - removeHeaders:
              pattern: "HTTP_*"
          - removeHeaders:
              pattern: "CamelHttp*"
          - removeHeader:
              name: CamelHttpUri
          - removeHeader:
              name: CamelHttpUrl
          - removeHeader:
              name: CamelHttpPath
          - to:
              uri: "http://localhost:8081/provider/locations?bridgeEndpoint=true"
          - to:
              uri: "xslt:classpath:xslt/identity.xsl"