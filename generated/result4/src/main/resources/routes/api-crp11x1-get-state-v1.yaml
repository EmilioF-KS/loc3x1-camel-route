route:
  id: api-crp11x1-get-state-v1
  from:
    uri: platform-http:/api/crp11x1/v1/get-state-or-province
    steps:
      - setHeader:
          name: Content-Type
          constant: application/xml
      - choice:
          when:
            - simple: "{{security.requireApiKey}} == 'true' && ${header.X-API-Key} == null"
              steps:
                - bean:
                    ref: com.example.fault.EnhancedFaultBuilder
                    method: build
                    parameters:
                      - AUTH
                      - Missing API key
                      - X-API-Key header required
                - stop: true
      - log:
          message: "crp11x1 request: ${body}"
      - bean:
          ref: com.example.validation.XmlSchemaValidator
          method: validateBody
          parameters:
            - ${body}
            - contracts/selected/StateOrProvinceRetrievalCRP11X1/GetStateOrProvinceRequest.xsd
      - to:
          uri: direct:mock/crp11x1
      - log:
          message: "crp11x1 response: ${body}"
      - bean:
          ref: com.example.validation.XmlSchemaValidator
          method: validateBody
          parameters:
            - ${body}
            - contracts/selected/StateOrProvinceRetrievalCRP11X1/GetStateOrProvinceListReply.xsd

