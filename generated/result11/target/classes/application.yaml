spring:
  application:
    name: loc-service11

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.camel: DEBUG
    org.springframework.web: DEBUG

camel:
  main:
    routesIncludePattern: classpath:routes/*.yaml

providers:
  mock:
    baseUrl: http://localhost:8093
