# Global Exception Handler
- route:
    id: "GlobalExceptionHandler"
    on-exception:
      - exception: "java.lang.Exception"
        handled:
          constant: "true"
        steps:
          - log:
              message: "EISP0001E Service Processing Exception: ${exception.message}"
              logging-level: ERROR
          - set-body:
              simple: '{"faultMessageText": "EISP0001E Service Processing Exception: ${exception.message}"}'
          - set-header:
              name: "CamelHttpResponseCode"
              constant: "500"
          - marshal:
              json:
                library: Jackson
          - stop: {}