name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install minimal Python tooling (yq)
        run: |
          python -m pip install --upgrade pip
          pip install yq

      - name: Tooling Preflight
        run: |
          bash scripts/preflight.sh

      - name: Record Versions
        run: |
          mkdir -p ci/artifacts
          echo "Date: $(date -u)" > ci/artifacts/versions.txt
          echo "JAVA: $(java -version 2>&1 | head -n1)" >> ci/artifacts/versions.txt
          echo "PYTHON: $(python3 --version 2>&1)" >> ci/artifacts/versions.txt
          echo "MAVEN: $(mvn -v 2>&1 | head -n1)" >> ci/artifacts/versions.txt

      - name: Upload CI Versions
        uses: actions/upload-artifact@v4
        with:
          name: ci-versions
          path: ci/artifacts/versions.txt

      - name: Build (Maven)
        run: |
          mvn -f modules/pom.xml -B -q -DskipITs=false clean verify

      - name: Run tests (Master Runner)
        continue-on-error: true
        run: |
          bash scripts/test_master.sh --all

      - name: Upload JUnit Reports
        if: ${{ always() && hashFiles('tests/results/junit/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: tests/results/junit

      - name: Upload Logs
        if: ${{ always() && hashFiles('tests/results/logs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/results/logs

      - name: Upload Summaries
        if: ${{ always() && hashFiles('tests/results/html/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-summaries
          path: tests/results/html

  container-test:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inbound image
        run: |
          docker build -f docker/Dockerfile.inbound -t camel-route-inbound:ci .

      - name: Run inbound container
        run: |
          docker run -d --name inbound -p 8085:8085 \
            -e INBOUND_LOC3X1B_ADDRESS="http://0.0.0.0:8085/services/BasicService" \
            camel-route-inbound:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' inbound || echo "starting")
            echo "Health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' inbound)" = "healthy"

      - name: Probe WSDL
        run: |
          mkdir -p ci/artifacts
          curl -fsS http://localhost:8085/services/BasicService?wsdl | tee ci/artifacts/inbound.wsdl

      - name: Collect logs
        run: |
          docker logs inbound > ci/artifacts/inbound.logs.txt || true

      - name: Upload container artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-inbound-artifacts
          path: |
            ci/artifacts/inbound.wsdl
            ci/artifacts/inbound.logs.txt