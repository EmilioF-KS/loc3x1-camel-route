name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install minimal Python tooling (yq)
        run: |
          python -m pip install --upgrade pip
          pip install yq

      - name: Tooling Preflight
        run: |
          bash scripts/preflight.sh

      - name: Build (Maven)
        run: |
          mvn -B -q -DskipITs=false clean verify

      - name: Run tests (Master Runner)
        run: |
          bash scripts/test_master.sh --all

      - name: Upload JUnit Reports
        if: ${{ always() && hashFiles('tests/results/junit/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: tests/results/junit

      - name: Upload Logs
        if: ${{ always() && hashFiles('tests/results/logs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/results/logs

      - name: Upload Summaries
        if: ${{ always() && hashFiles('tests/results/html/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-summaries
          path: tests/results/html