name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Syntax check backend
        run: |
          python -m compileall -q backend || exit 1
      - name: Run tests (if present)
        run: |
          if [ -d backend/tests ] || [ -d agent/tests ]; then
            pytest -q || exit 1
          else
            echo "No tests yet"
          fi